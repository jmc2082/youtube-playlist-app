# Response headers for Amplify Hosting (monorepo format; must live at the repo root).
applications:
  - appRoot: code
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-Frame-Options
            value: DENY
          # Must send the origin cross-site: the API key's website restriction
          # and the YouTube embedded player both rely on the Referer header.
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
      # Vite's hashed bundles never change — cache them for a year.
      - pattern: 'assets/**/*'
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
