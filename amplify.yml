# AWS Amplify Hosting build spec. The app lives in ./code (monorepo layout).
# Environment variables (set per branch in the Amplify console):
#   VITE_GOOGLE_CLIENT_ID, VITE_YOUTUBE_API_KEY
version: 1
applications:
  - appRoot: code
    frontend:
      phases:
        preBuild:
          commands:
            # Vite 8 needs Node 22+
            - nvm install 22
            - nvm use 22
            # Node 22 ships npm 10, which can't read the npm 11 lock file
            # (fails with "Missing: @emnapi/... from lock file"). Match local npm.
            - npm install -g npm@11.6.2   # keep in sync with "packageManager" in code/package.json
            - node --version && npm --version
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # Fail the deploy if a required variable is missing, instead of shipping a broken app.
            - '[ -n "$VITE_GOOGLE_CLIENT_ID" ] || (echo "VITE_GOOGLE_CLIENT_ID is not set in Amplify env vars" && exit 1)'
            - npm test
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
